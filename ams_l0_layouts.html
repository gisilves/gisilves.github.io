<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMS-L0 Layouts</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e2e3e6;
    --text: #1b1c1f;
    --muted: #6b6d73;
    --accent: #5b8def;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    position: relative;
    overflow: hidden;
  }
 
  body::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60vmin;
    height: 60vmin;
    transform: translate(-50%, -50%);
    background-image: url("favicon.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    opacity: 0.06;
    pointer-events: none;
  }


  .wrap {
    display: flex;
    gap: 28px;
    padding: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    width: 260px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover,
  .btn:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    background: #eef3fd;
    box-shadow: 0 10px 30px rgba(91, 141, 239, 0.18);
  }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .btn:active {
    transform: translateY(0);
  }

  @media (max-width: 560px) {
    .btn {
      width: 100%;
      max-width: 320px;
      height: 130px;
    }
  }
</style>
</head>
<body>

  <div class="wrap">
    <a class="btn" href="AMS_L0_detector_layout.html">ISS Layout</a>
    <a class="btn" href="AMS_L0_detector_layout_CERN.html">CERN SPS Layout</a>
  </div>

</body>
</html>

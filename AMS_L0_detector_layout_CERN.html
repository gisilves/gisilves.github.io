<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMS-L0 Detector Layout (as seen from the beam at CERN SPS)</title>
<style>
  body {
    font-family: Helvetica, Arial, sans-serif;
    background: #ffffff;
    margin: 0;
    padding: 24px;
  }
  .layout-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px;
  }
  .plot-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 850px;
    max-width: 100%;
  }
  .placeholder {
    width: 800px;
    max-width: 100%;
    height: auto;
    border: 1px solid #bbbbbb;
    box-sizing: border-box;
    display: block;
  }
  .plot-title {
    font-size: 16px;
    color: #333333;
    margin: 10px 0;
    text-align: center;
  }
  .button-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button.bk-btn {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f5f5f5;
    cursor: pointer;
  }
  button.bk-btn:hover {
    background: #e9e9e9;
  }
</style>
</head>
<body>

<div class="layout-row">

  <div class="plot-col">
    <div class="plot-title">AMS-L0 U Detector Layout (as seen from the beam at CERN SPS)</div>
    <img class="placeholder" src="images/u_layout.png" alt="AMS-L0 U Detector Layout">
    <div class="button-row">
      <button class="bk-btn" onclick="window.location.replace('AMS_L0_detector_layout_U_CERN.html');">Go to AMS-L0 Detector Layout U @ CERN</button>
      <button class="bk-btn" onclick="downloadFile('L0_data/U_nominal_positions_CERN.csv');">Download Nominal positions U @ CERN</button>
    </div>
  </div>

  <div class="plot-col">
    <div class="plot-title">AMS-L0 Y Detector Layout (as seen from the beam at CERN SPS)</div>
    <img class="placeholder" src="images/y_layout.png" alt="AMS-L0 Y Detector Layout">
    <div class="button-row">
      <button class="bk-btn" onclick="window.location.replace('AMS_L0_detector_layout_Y_CERN.html');">Go to AMS-L0 Detector Layout Y @ CERN</button>
      <button class="bk-btn" onclick="downloadFile('L0_data/Y_nominal_positions_CERN.csv');">Download Nominal positions Y @ CERN</button>
    </div>
  </div>

</div>

<script>
  function downloadFile(file) {
    const a = document.createElement('a');
    a.href = file;
    a.download = file;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>

</body>
</html>
